[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliance-rules"
version = "0.1.1"
description = "Stateless AML transaction screening rules engine"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["compliance_rules"]
